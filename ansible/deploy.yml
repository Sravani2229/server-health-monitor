---
- name: Deploy server Health Monitoring App
  hosts: monitor 
  become: true
  tasks:
    - name: Install Python and pip
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
        state: present
        update_cache: true
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/server-health-monitor
        state: directory
        mode: "0755"
    - name: Copy Python application
      ansible.builtin.copy:
        src: ../app.py 
        dest: /opt/server-health-monitor/app.py
        mode: "0755"
    - name: copy requirements file
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: /opt/server-health-monitor/requirements.txt
        mode: "0644"
    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: /opt/server-health-monitor/requirements.txt
        extra_args: --break-system-packages

    - name: Copy systemd service file
      ansible.builtin.template:
        src: server-health-monitor.service.j2
        dest: /etc/systemd/system/server-health-monitor.service
        mode: "0644"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start Server Health Monitor service
      ansible.builtin.systemd:
        name: server-health-monitor
        state: started
        enabled: true